name: Update Fallback Data

on:
  # 毎日午前3時（日本時間）に実行
  schedule:
    - cron: '0 18 * * *'  # UTC 18:00 = JST 03:00
  # 手動実行も可能
  workflow_dispatch:
  # 管理画面の「今すぐ反映」ボタンから起動（GAS → repository_dispatch）
  repository_dispatch:
    types: [resync]

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Cuisine Data
        run: |
          curl -fsSL "${{ secrets.BANQUET_API_URL }}?type=cuisine" -o /tmp/banquet-cuisine-response.json
          echo "Cuisine API response:"
          cat /tmp/banquet-cuisine-response.json | head -c 500

      - name: Fetch Config Data
        run: |
          curl -fsSL "${{ secrets.BANQUET_API_URL }}?type=config" -o /tmp/banquet-config-response.json
          echo "Config API response:"
          cat /tmp/banquet-config-response.json | head -c 500

      - name: Fetch SEO Data
        run: |
          curl -fsSL "${{ secrets.BANQUET_API_URL }}?type=seo" -o /tmp/banquet-seo-response.json
          echo "SEO API response:"
          cat /tmp/banquet-seo-response.json | head -c 500

      - name: Fetch Texts Data
        run: |
          curl -fsSL "${{ secrets.BANQUET_API_URL }}?type=texts" -o /tmp/banquet-texts-response.json
          echo "Texts API response:"
          cat /tmp/banquet-texts-response.json | head -c 500

      - name: Update Fallback Data
        run: node scripts/update-fallback.js

      - name: Build SEO into HTML
        env:
          GA4_ID: ${{ secrets.GA4_ID }}
        run: node scripts/build-seo.js

      - name: Build Texts into HTML
        run: node scripts/build-texts.js

      - name: Check for changes
        id: check_changes
        run: git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and Push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update data & SEO from Google Sheets

          Auto-updated by GitHub Actions (data fallback + SEO bake)."
          git push
