name: Optimize Images

# images/ に PNG/JPG が追加されたら、自動で WebP に変換・リサイズし、
# HTML の参照を .webp に張り替えてコミットする。
# → どのPC・GitHubのWeb UIから追加しても、サーバー側で自動軽量化される。

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Convert to WebP & fix HTML refs
        run: python scripts/optimize-images.py --delete-source --fix-html

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変換対象なし（変更なし）"
          else
            # [skip ci] で自身の再トリガーを防止（無限ループ防止）
            git commit -m "chore: optimize images to WebP [skip ci]"
            git push
          fi
